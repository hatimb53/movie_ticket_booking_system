spring:
  application:
    name: movie-ticket-booking-system

  datasource:
    # LOCK_TIMEOUT keeps SELECT ... FOR UPDATE *blocking* (not erroring) while a competing
    # transaction holds the row lock — essential for the seat-hold serialization test on H2.
    url: jdbc:h2:mem:mtbs;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    # Base64-encoded 256-bit secret for HS256. Override via APP_JWT_SECRET in real deployments.
    secret: ${APP_JWT_SECRET:c2VjcmV0LWtleS1mb3ItbXRicy1kZXYtb25seS1kby1ub3QtdXNlLWluLXByb2Q=}
    expiration-ms: 3600000
  pricing:
    weekend-multiplier: 1.25
  hold:
    ttl-seconds: 60
    sweeper-interval-ms: 15000
  reminder:
    window-minutes: 120
    interval-ms: 60000
  seed:
    enabled: false
